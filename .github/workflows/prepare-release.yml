name: Prepare release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto keeps the draft version, defaults to patch)'
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    # Manual overrides also always use main, never an unreviewed branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check release preparation
        run: python3 tests/test_prepare_release.py

      - name: Check the add-on with Lua 5.1
        run: |
          python3 -m pip install lupa==2.8
          python3 tests/test_addon.py

      - name: Prepare the changelog and unpublished release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/prepare_release.py --bump "$BUMP"
